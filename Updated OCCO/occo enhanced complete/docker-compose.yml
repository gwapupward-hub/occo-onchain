services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: occo
      POSTGRES_PASSWORD: occo
      POSTGRES_DB: occo
    ports:
      - "5432:5432"
    volumes:
      - occo_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  occo_pg:
