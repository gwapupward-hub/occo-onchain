openapi: 3.0.0
info:
  title: OCCO API
  description: OCCO provides standardized on-chain credit scores.
  version: v1
servers:
  - url: https://api.occo.org
paths:
  /v1/score/{wallet}:
    get:
      summary: Get OCCO score
      parameters:
        - name: wallet
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Score response
  /v1/report/{wallet}:
    get:
      summary: Get full OCCO credit report
  /v1/profile/claim:
    post:
      summary: Claim wallet profile (opt-in)
  /v1/attest:
    post:
      summary: Issue OCCO attestation
